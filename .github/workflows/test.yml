name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run tests (no Whisper, so the fallback paths are covered too)
        run: uv run --no-project --python ${{ matrix.python }} --with pytest --with numpy python -m pytest -q tests
