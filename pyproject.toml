[project]
name = "suba"
version = "0.3.0"
description = "Fix out-of-sync subtitles automatically: Whisper text matching, cross-language speech-timing alignment, and PAL/NTSC drift correction"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["numpy"]
keywords = ["subtitles", "srt", "vtt", "sync", "whisper", "ffmpeg", "alignment"]
classifiers = [
    "Environment :: Console",
    "Topic :: Multimedia :: Video",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
whisper = ["openai-whisper"]

[project.urls]
Homepage = "https://github.com/xy3/suba"
Issues = "https://github.com/xy3/suba/issues"

[project.scripts]
suba = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]

[tool.hatch.build.targets.sdist]
only-include = ["main.py", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
